apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: scanner-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      initContainers:
        - name: model-cache
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /models"]
          volumeMounts:
            - name: model-cache
              mountPath: /models
      containers:
        - name: ai-service
          image: ghcr.io/botshabelo-app/smart-consumable-scanner-ai-ai-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_PATH
              value: /models
            - name: LOG_LEVEL
              value: info
          volumeMounts:
            - name: model-cache
              mountPath: /models
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: model-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: scanner-ai
spec:
  selector:
    app: ai-service
  ports:
    - port: 8000
      targetPort: 8000
