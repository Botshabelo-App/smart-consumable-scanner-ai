version: '3.8'

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: consumable_scanner
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner -d consumable_scanner"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    logging: *default-logging
    environment:
      - MODEL_PATH=/app/models
      - LOG_LEVEL=info
      - AI_STRICT_MODE=true
    volumes:
      - ai_model_data:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DATABASE_URL=postgresql://scanner:${POSTGRES_PASSWORD}@db:5432/consumable_scanner
      - AI_SERVICE_URL=http://ai-service:8000
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env}
      - DEBUG=false
      - FALLBACK_TO_SQLITE=false
      - UPLOAD_DIR=/app/uploads
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    build: ./nginx
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    volumes:
      - backend_uploads:/app/uploads:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx

volumes:
  postgres_data:
  backend_uploads:
  ai_model_data:
  caddy_data:
  caddy_config:
