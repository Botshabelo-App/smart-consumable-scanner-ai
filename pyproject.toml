[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-consumable-scanner-ai-pilot"
version = "0.1.9-rc1"
description = "Smart Consumable Scanner AI — combined pilot backend and AI inference service"
requires-python = ">=3.10"
authors = [{name = "Moeketsi Daniel"}]
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.3.4",
    "sqlalchemy==2.0.31",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    "python-multipart==0.0.32",
    "pyjwt==2.13.0",
    "bcrypt==4.1.3",
    "httpx==0.27.0",
    "pillow==12.3.0",
    "reportlab==4.2.0",
    "openpyxl==3.1.4",
    "pandas==2.2.2",
    "qrcode==7.4.2",
    "slowapi==0.1.9",
    "pytesseract==0.3.13",
    "numpy==1.26.4",
    "opencv-python-headless==4.10.0.82",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "ultralytics==8.3.253",
    "scikit-learn==1.5.0",
    "tqdm==4.66.4",
]

[project.scripts]
serve = "main:app"
