services:
  - type: web
    name: smart-consumable-scanner-ai
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-consumable-scanner-db
          property: connectionString
      - key: AI_SERVICE_URL
        value: http://localhost:8080/ai
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["*"]'

databases:
  - name: smart-consumable-scanner-db
    plan: starter
    region: oregon
